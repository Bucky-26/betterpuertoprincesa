name: Deploy Previews

# Every same-repo PR into `main` gets a standard Vercel Preview deployment,
# commented on the PR. Fork PRs are skipped (no access to secrets). Production deploys happen in release.yml, gated behind
# semantic-release on `main`.
on:
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # GitHub withholds repo secrets from fork PRs, so VERCEL_TOKEN is empty
    # there and `vercel pull` fails. Skip instead of failing; don't switch to
    # pull_request_target, which would hand the token to untrusted code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@62.0.0

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (preview)
        id: deploy-preview
        # Without --archive=tgz, the CLI uploads every build output file as
        # its own request and blows through Vercel's free-plan per-file
        # upload quota ("Too many requests ... code: api-upload-free"),
        # surfacing as an opaque "Upload aborted". Bundling into one tgz
        # upload avoids that entirely. Retry loop stays as a safety net for
        # genuine transient network blips.
        run: |
          for i in 1 2 3; do
            url=$(vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}) && break
            echo "Deploy attempt $i failed, retrying in 15s..."
            sleep 15
            if [ "$i" = "3" ]; then
              echo "::error::Deploy failed after 3 attempts"
              exit 1
            fi
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${{ steps.deploy-preview.outputs.url }}`
            });
